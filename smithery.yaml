# Remote connection metadata. Directory submission uses the hosted URL.
# Confirm the current Smithery submission schema before automated ingestion.
name: prompeteer
description: >-
  Prompeteer generates contextual prompts and agent skills tuned to the model
  you are actually using, across 140+ AI platforms and 129 languages. Every
  prompt gets a 16-dimension Prompt Score, and skills get a Skill Score. Saved
  prompts live in PromptDrive and roam across platforms. Free to start.

startCommand:
  type: http
  url: https://prompeteer.ai/mcp
  authType: oauth2
  authorizationUrl: https://prompeteer.ai/oauth/authorize
  tokenUrl: https://prompeteer.ai/oauth/token
